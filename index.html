<!doctype html>
<html lang="ur">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Patex ERSS</title>
<meta name="theme-color" content="#5A3A26">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ERSS">
<style>
html,body{margin:0;height:100%;background:#FAF7F2;font-family:system-ui,sans-serif}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
#load{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#5A3A26}
#load img{width:96px;height:96px;border-radius:22px}
#inst{position:fixed;left:12px;right:12px;bottom:12px;z-index:9;display:none;align-items:center;gap:12px;background:#5A3A26;color:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 8px 28px rgba(0,0,0,.28)}
#inst img{width:44px;height:44px;border-radius:10px;flex:none}
#inst .t{flex:1;min-width:0;line-height:1.35}#inst .t b{display:block;font-size:16px}#inst .t span{font-size:13px;opacity:.9}
#inst button{border:0;border-radius:10px;font:600 15px system-ui,sans-serif;padding:10px 14px;cursor:pointer}
#instGo{background:#FFC72A;color:#1B1511}#instX{background:transparent;color:#fff;font-size:20px;padding:6px 8px}
#off{display:none;padding:24px;text-align:center;color:#5A3A26}
</style>
</head>
<body>
<div id="load"><img src="icon-192.png" alt=""><div dir="rtl">ERSS &#1705;&#1726;&#1604; &#1585;&#1729;&#1575; &#1729;&#1746;&#8230;</div></div>
<div id="off">&#1575;&#1606;&#1657;&#1585;&#1606;&#1740;&#1657; &#1606;&#1729;&#1740;&#1722; &#1729;&#1746;&#1748; &#1606;&#1740;&#1657; &#1670;&#1604;&#1575; &#1705;&#1585; &#1583;&#1608;&#1576;&#1575;&#1585;&#1729; &#1705;&#1726;&#1608;&#1604;&#1740;&#1722;&#1748;<br>No internet. Please connect and open again.</div>
<div id="inst" dir="rtl" role="dialog" aria-label="Install ERSS"><img src="icon-192.png" alt=""><div class="t" dir="rtl"><b>ERSS &#1575;&#1740;&#1662; &#1575;&#1606;&#1587;&#1657;&#1575;&#1604; &#1705;&#1585;&#1740;&#1722;</b><span id="instMsg">&#1601;&#1608;&#1606; &#1705;&#1740; &#1729;&#1608;&#1605; &#1587;&#1705;&#1585;&#1740;&#1606; &#1662;&#1585; ERSS &#1705;&#1575; &#1570;&#1574;&#1740;&#1705;&#1606; &#1576;&#1606; &#1580;&#1575;&#1574;&#1746; &#1711;&#1575;</span></div><button id="instGo" type="button">&#1575;&#1606;&#1587;&#1657;&#1575;&#1604; &#1705;&#1585;&#1740;&#1722;</button><button id="instX" type="button" aria-label="Close">&times;</button></div>
<iframe id="app" title="Patex ERSS" allow="microphone; autoplay; clipboard-write" src="https://script.google.com/macros/s/AKfycbxzVGksxARZEiMuRAtiLH8xJbtSmis7_BwMCNOR5R2-l7VT-ANTdGAL6R1PP11NxshCYA/exec"></iframe>
<script>
var f=document.getElementById("app");f.addEventListener("load",function(){document.getElementById("load").style.display="none"});
if(!navigator.onLine){f.style.display="none";document.getElementById("load").style.display="none";document.getElementById("off").style.display="block"}

var DP=null,box=document.getElementById("inst"),standalone=window.matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
var ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
function showInst(){if(!standalone)box.style.display="flex"}
window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();DP=e;showInst()});
window.addEventListener("appinstalled",function(){box.style.display="none"});
document.getElementById("instGo").onclick=function(){if(DP){DP.prompt();DP.userChoice.then(function(){DP=null;box.style.display="none"})}else if(ios){document.getElementById("instMsg").innerHTML="Safari &#1605;&#1740;&#1722; &#1606;&#1740;&#1670;&#1746; Share Share &#9099;#11014; &#1583;&#1576;&#1575;&#1574;&#1740;&#1722;&#1548; &#1662;&#1726;&#1585; Add to Home Screen"}else{document.getElementById("instMsg").innerHTML="Chrome &#1705;&#1575; &#8942; &#1605;&#1740;&#1606;&#1608; &#1705;&#1726;&#1608;&#1604;&#1740;&#1722; &#8592; Install app / Add to Home screen"}};
document.getElementById("instX").onclick=function(){box.style.display="none"};
if(ios&&!standalone)showInst();
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){})}
</script>
</body>
</html>
